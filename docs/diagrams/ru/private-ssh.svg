<svg xmlns="http://www.w3.org/2000/svg" width="324" height="124" viewBox="0 0 324 124" role="img" aria-labelledby="private-ssh-title private-ssh-desc" xml:lang="ru">
  <title id="private-ssh-title">Закрыть SSH снаружи совсем</title>
  <desc id="private-ssh-desc">Пока сервер отвечает на 22-м порту, его круглосуточно перебирают чужие боты. Подключив ноду, порт на публичном интерфейсе можно закрыть насовсем - и заходить на адрес в сети, по правилу из панели. Снаружи стучаться становится некуда, а список тех, кому вход открыт, лежит в одном месте и правится мышью.</desc>
  <rect width="324" height="124" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="8" width="92" height="28" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="46.0" y="26.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">интернет</text>
    <line x1="92" y1="22" x2="152" y2="22" stroke="#819287" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="158" y1="16" x2="170" y2="28" stroke="#a5b3aa" stroke-width="1.6" />
    <line x1="170" y1="16" x2="158" y2="28" stroke="#a5b3aa" stroke-width="1.6" />
    <text x="150" y="44" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="8.5" text-anchor="middle">22/tcp закрыт</text>
    <rect x="0" y="60" width="92" height="28" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="46.0" y="78.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">ноутбук</text>
    <line x1="92" y1="74" x2="196" y2="74" stroke="#9aefb4" stroke-width="2" />
    <text x="144" y="68" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">:22</text>
    <rect x="196" y="30" width="104" height="52" rx="7" fill="#1e2a23" stroke="#9aefb4" />
    <text x="248.0" y="60.5" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">app-01</text>
  </g>
</svg>
