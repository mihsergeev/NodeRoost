<svg xmlns="http://www.w3.org/2000/svg" width="324" height="116" viewBox="0 0 324 116" role="img" aria-labelledby="provider-change-title provider-change-desc" xml:lang="ru">
  <title id="provider-change-title">Сменился провайдер - ничего не сломалось</title>
  <desc id="provider-change-desc">Переехали в другой дата-центр, провайдер выдал новый адрес, машину увезли из офиса домой. В тайлнете у нее прежний адрес и прежнее имя, так что правила, скрипты и закладки переписывать не нужно.</desc>
  <rect width="324" height="116" fill="#101714" />
