    <line x1="14" y1="21" x2="118" y2="21" stroke="#a5b3aa" stroke-width="1.2" />
    <line x1="132" y1="21" x2="163" y2="21" stroke="#819287" stroke-width="1.5" />
    <path d="M162 17 L168 21 L162 25 Z" fill="#819287" />
    <rect x="168" y="6" width="132" height="30" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="234.0" y="24.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">198.51.100.9</text>
    <rect x="0" y="50" width="300" height="32" rx="7" fill="#1e2a23" stroke="#9aefb4" />
    <text x="150.0" y="63.0" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">100.64.0.7</text>
    <text x="150.0" y="76.0" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">в тайлнете — не меняется</text>
  </g>
