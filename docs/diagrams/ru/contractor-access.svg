    <line x1="92" y1="46" x2="119" y2="46" stroke="#9aefb4" stroke-width="1.5" />
    <path d="M118 42 L124 46 L118 50 Z" fill="#9aefb4" />
    <rect x="124" y="4" width="176" height="84" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="212.0" y="49.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle" />
    <text x="136" y="20" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="9.5" text-anchor="start">prod-db</text>
    <rect x="136" y="28" width="72" height="22" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="172.0" y="42.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">db-1:5432</text>
    <rect x="216" y="28" width="72" height="22" rx="7" fill="#18221d" stroke="#2d3a31" />
