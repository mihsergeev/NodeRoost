<svg xmlns="http://www.w3.org/2000/svg" width="324" height="116" viewBox="0 0 324 116" role="img" aria-labelledby="contractor-access-title contractor-access-desc" xml:lang="ru">
  <title id="contractor-access-title">Подрядчику - только то, что нужно</title>
  <desc id="contractor-access-desc">Доступ выдается не на сервер целиком, а на порт: дали 5432 - подрядчик видит базу и больше ничего, ни SSH, ни админку. Выдать можно сразу на роль - группу серверов: добавили в нее еще один, он появился у подрядчика сам. Закончил работу - удалили его устройство, и доступ исчез везде сразу.</desc>
  <rect width="324" height="116" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="30" width="92" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
