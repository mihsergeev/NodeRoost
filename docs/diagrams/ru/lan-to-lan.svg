<svg xmlns="http://www.w3.org/2000/svg" width="324" height="108" viewBox="0 0 324 108" role="img" aria-labelledby="lan-to-lan-title lan-to-lan-desc" xml:lang="ru">
  <title id="lan-to-lan-title">Две локалки без белых IP</title>
  <desc id="lan-to-lan-desc">Офис и склад начинают видеть сети друг друга. На каждой стороне ставите по ноде, она объявляет свою подсеть, вы ее одобряете - дальше правилами решаете, кто куда ходит. Белый адрес не нужен ни там, ни там.</desc>
  <rect width="324" height="108" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="2" y="22" width="130" height="40" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="67.0" y="39.0" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">node-a</text>
    <text x="67.0" y="52.0" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">192.168.10.0/24</text>
    <rect x="168" y="22" width="130" height="40" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="233.0" y="39.0" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">node-b</text>
    <text x="233.0" y="52.0" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">192.168.50.0/24</text>
    <line x1="132" y1="42" x2="168" y2="42" stroke="#9aefb4" stroke-width="2" />
  </g>
</svg>
