<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="432" viewBox="0 0 1012 432" role="img" aria-labelledby="architecture-title architecture-desc" xml:lang="ru">
  <title id="architecture-title">Архитектура NodeRoost, headscale и соединений между узлами</title>
  <desc id="architecture-desc">Схема из двух слоёв: сверху управление — браузер, обратный прокси, панель и headscale; снизу две ноды, соединённые напрямую по WireGuard. Между слоями идут только управляющие данные Настройки идут через панель. Трафик - между узлами.</desc>
  <rect width="1012" height="432" fill="#101714" />
  <g transform="translate(16 16)">
    <text x="0" y="22" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="11" text-anchor="start">УПРАВЛЕНИЕ</text>
    <rect x="0" y="34" width="980" height="142" rx="12" fill="#18221d" stroke="#2d3a31" />
    <rect x="65" y="70" width="160" height="60" rx="10" fill="#18221d" stroke="#2d3a31" />
    <text x="145.0" y="96" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Браузер</text>
    <text x="145.0" y="114" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">администратор</text>
    <rect x="275" y="70" width="190" height="60" rx="10" fill="#18221d" stroke="#2d3a31" />
    <text x="370.0" y="96" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Обратный прокси</text>
    <text x="370.0" y="114" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">TLS · доверенные адреса</text>
    <rect x="515" y="70" width="180" height="60" rx="10" fill="#1e2a23" stroke="#9aefb4" />
    <text x="605.0" y="96" fill="#9aefb4" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">NodeRoost</text>
    <text x="605.0" y="114" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">панель + Postgres</text>
    <rect x="745" y="70" width="170" height="60" rx="10" fill="#18221d" stroke="#2d3a31" />
    <text x="830.0" y="96" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">headscale</text>
    <text x="830.0" y="114" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">control-сервер</text>
    <line x1="225" y1="100" x2="268" y2="100" stroke="#819287" stroke-width="1.5" />
    <path d="M268 95.5 L275 100 L268 104.5 Z" fill="#819287" />
    <line x1="465" y1="100" x2="508" y2="100" stroke="#819287" stroke-width="1.5" />
    <path d="M508 95.5 L515 100 L508 104.5 Z" fill="#819287" />
    <line x1="695" y1="100" x2="738" y2="100" stroke="#819287" stroke-width="1.5" />
    <path d="M738 95.5 L745 100 L738 104.5 Z" fill="#819287" />
    <text x="490" y="160" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">внутренняя сеть Docker · управляющий API наружу не выставлен</text>
    <line x1="165" y1="183" x2="165" y2="279" stroke="#819287" stroke-width="1.5" stroke-dasharray="5 4" />
    <path d="M160.5 183 L165 176 L169.5 183 Z" fill="#819287" />
    <path d="M160.5 279 L165 286 L169.5 279 Z" fill="#819287" />
    <line x1="815" y1="183" x2="815" y2="279" stroke="#819287" stroke-width="1.5" stroke-dasharray="5 4" />
    <path d="M810.5 183 L815 176 L819.5 183 Z" fill="#819287" />
    <path d="M810.5 279 L815 286 L819.5 279 Z" fill="#819287" />
    <text x="490" y="216" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">между слоями ходят только ключи, карта сети, политика и настройки агента</text>
    <text x="490" y="240" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">пользовательский трафик сюда не попадает</text>
    <text x="0" y="282" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="11" text-anchor="start">ДАННЫЕ</text>
    <rect x="65" y="296" width="200" height="60" rx="10" fill="#18221d" stroke="#2d3a31" />
    <text x="165.0" y="322" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">нода A</text>
    <text x="165.0" y="340" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">например, ноутбук</text>
    <rect x="715" y="296" width="200" height="60" rx="10" fill="#18221d" stroke="#2d3a31" />
    <text x="815.0" y="322" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">нода B</text>
    <text x="815.0" y="340" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">например, сервер</text>
    <line x1="265" y1="326" x2="715" y2="326" stroke="#9aefb4" stroke-width="2.5" />
    <text x="490" y="314" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">WireGuard — напрямую между узлами</text>
    <text x="490" y="382" fill="#a5b3aa" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">DERP включается, только если прямое соединение не установилось</text>
  </g>
</svg>
