<svg xmlns="http://www.w3.org/2000/svg" width="324" height="128" viewBox="0 0 324 128" role="img" aria-labelledby="server-exit-title server-exit-desc" xml:lang="ru">
  <title id="server-exit-title">Весь трафик сервера - через другой сервер</title>
  <desc id="server-exit-desc">Сервер выходит в интернет через выбранный узел: его запросы приходят наружу с адреса шлюза - например, из нужной страны. Включается и выключается галкой в карточке сервера. Обычно после такого сервер пропадает: ответы на входящие соединения уходят в туннель и не доходят обратно - рвется SSH, перестает открываться сайт. Здесь этого нет: ответ уходит тем же путем, которым пришел запрос, и сервер остается доступен по своему адресу.</desc>
  <rect width="324" height="128" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="22" width="88" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="44.0" y="41.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">app-01</text>
    <line x1="88" y1="38" x2="110" y2="38" stroke="#9aefb4" stroke-width="2" />
    <rect x="110" y="22" width="80" height="32" rx="7" fill="#1e2a23" stroke="#9aefb4" />
    <text x="150.0" y="41.5" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">gw-nl</text>
    <line x1="190" y1="38" x2="207" y2="38" stroke="#819287" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M206 34 L212 38 L206 42 Z" fill="#819287" />
    <rect x="212" y="22" width="88" height="32" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="256.0" y="41.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">интернет</text>
    <line x1="34" y1="92" x2="34" y2="60" stroke="#9aefb4" stroke-width="2" />
    <path d="M30 60 L34 54 L38 60 Z" fill="#9aefb4" />
    <text x="48" y="90" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="9" text-anchor="start">вход по своему IP</text>
  </g>
</svg>
