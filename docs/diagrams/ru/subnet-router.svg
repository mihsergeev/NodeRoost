<svg xmlns="http://www.w3.org/2000/svg" width="324" height="116" viewBox="0 0 324 116" role="img" aria-labelledby="subnet-router-title subnet-router-desc" xml:lang="ru">
  <title id="subnet-router-title">Железки, на которые ничего не поставить</title>
  <desc id="subnet-router-desc">IPMI, камеры, принтер, управляемый свитч, старый NAS - клиента туда не установить, а дотянуться надо. Ставите ноду на любую машину в той же сети, она отдает подсеть, вы ее одобряете - и работаете со всем этим по внутренним адресам, как будто сидите рядом. Доступ выдается по-прежнему правилом: кому и на какой порт.</desc>
  <rect width="324" height="116" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="30" width="84" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="42.0" y="49.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">ноутбук</text>
    <line x1="84" y1="46" x2="112" y2="46" stroke="#9aefb4" stroke-width="2" />
    <rect x="112" y="4" width="188" height="84" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="124" y="20" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="start">серверная</text>
    <rect x="124" y="26" width="76" height="20" rx="7" fill="#1e2a23" stroke="#9aefb4" />
    <text x="162.0" y="39.5" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">gw-01</text>
    <rect x="208" y="26" width="80" height="20" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="248.0" y="39.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">ipmi</text>
    <rect x="124" y="50" width="76" height="20" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="162.0" y="63.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">camera</text>
    <rect x="208" y="50" width="80" height="20" rx="7" fill="#18221d" stroke="#2d3a31" />
