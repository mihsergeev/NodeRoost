<svg xmlns="http://www.w3.org/2000/svg" width="324" height="120" viewBox="0 0 324 120" role="img" aria-labelledby="split-tunnel-title split-tunnel-desc" xml:lang="en">
  <title id="split-tunnel-title">Not everything goes into the tunnel</title>
  <desc id="split-tunnel-desc">A normal VPN swallows all your traffic. Here the laptop reaches the internet directly and fast, and only what you listed goes through the network: office subnets, specific services, individual addresses.</desc>
  <rect width="324" height="120" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="32" width="88" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="44.0" y="51.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">laptop</text>
    <path d="M88 44 C120 44, 130 22, 162 22" fill="none" stroke="#9aefb4" stroke-width="2" />
    <path d="M88 52 C120 52, 130 74, 162 74" fill="none" stroke="#819287" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M162 70 L168 74 L162 78 Z" fill="#819287" />
    <rect x="170" y="6" width="130" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="235.0" y="25.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">work addresses</text>
    <rect x="170" y="58" width="130" height="32" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="235.0" y="77.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">internet</text>
    <text x="126" y="16" fill="#9aefb4" font-family="system-ui,sans-serif" font-size="8.5" text-anchor="middle">via the network</text>
    <text x="126" y="92" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="8.5" text-anchor="middle">direct</text>
  </g>
</svg>
