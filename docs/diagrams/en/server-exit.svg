<svg xmlns="http://www.w3.org/2000/svg" width="324" height="128" viewBox="0 0 324 128" role="img" aria-labelledby="server-exit-title server-exit-desc" xml:lang="en">
  <title id="server-exit-title">A server's whole traffic through another server</title>
  <desc id="server-exit-desc">The server reaches the internet through a node you pick, so its requests arrive from that node's address - from the country a partner expects, say. One tick on the server's card turns it on, another turns it off. Normally a server vanishes when its traffic is tunnelled: replies to incoming connections leave through the tunnel and never arrive, so SSH drops and the site stops answering. Not here - a reply goes back the way the request came, and the server stays reachable at its own address.</desc>
  <rect width="324" height="128" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="22" width="88" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="44.0" y="41.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">app-01</text>
    <line x1="88" y1="38" x2="110" y2="38" stroke="#9aefb4" stroke-width="2" />
    <rect x="110" y="22" width="80" height="32" rx="7" fill="#1e2a23" stroke="#9aefb4" />
    <text x="150.0" y="41.5" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">gw-nl</text>
    <line x1="190" y1="38" x2="207" y2="38" stroke="#819287" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M206 34 L212 38 L206 42 Z" fill="#819287" />
    <rect x="212" y="22" width="88" height="32" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="256.0" y="41.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">internet</text>
    <line x1="34" y1="92" x2="34" y2="60" stroke="#9aefb4" stroke-width="2" />
    <path d="M30 60 L34 54 L38 60 Z" fill="#9aefb4" />
    <text x="48" y="90" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="9" text-anchor="start">inbound on its own IP</text>
  </g>
</svg>
