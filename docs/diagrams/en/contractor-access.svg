<svg xmlns="http://www.w3.org/2000/svg" width="324" height="116" viewBox="0 0 324 116" role="img" aria-labelledby="contractor-access-title contractor-access-desc" xml:lang="en">
  <title id="contractor-access-title">A contractor gets exactly what they need</title>
  <desc id="contractor-access-desc">Access is granted to a port, not to the whole machine: give them 5432 and they see the database and nothing else - no SSH, no admin panel. It can go to a role - a group of servers: add another one to it and it shows up for them on its own. Job done - delete their device, and the access is gone everywhere at once.</desc>
  <rect width="324" height="116" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="30" width="92" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="46.0" y="49.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">contractor</text>
    <line x1="92" y1="46" x2="119" y2="46" stroke="#9aefb4" stroke-width="1.5" />
    <path d="M118 42 L124 46 L118 50 Z" fill="#9aefb4" />
    <rect x="124" y="4" width="176" height="84" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="212.0" y="49.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle" />
    <text x="136" y="20" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="9.5" text-anchor="start">prod-db</text>
    <rect x="136" y="28" width="72" height="22" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="172.0" y="42.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">db-1:5432</text>
    <rect x="216" y="28" width="72" height="22" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="252.0" y="42.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">db-2:5432</text>
    <rect x="136" y="58" width="152" height="22" rx="7" fill="#18221d" stroke="#2d3a31" stroke-dasharray="4 3" />
    <text x="212.0" y="72.5" fill="#eef3ef" font-family="system-ui,sans-serif" font-size="10.5" text-anchor="middle">+ new server</text>
  </g>
</svg>
