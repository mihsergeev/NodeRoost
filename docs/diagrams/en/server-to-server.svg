<svg xmlns="http://www.w3.org/2000/svg" width="324" height="112" viewBox="0 0 324 112" role="img" aria-labelledby="server-to-server-title server-to-server-desc" xml:lang="en">
  <title id="server-to-server-title">Server to server</title>
  <desc id="server-to-server-desc">The machines sit with different providers, in different data centres, with no network in common: the runner writes to the database, the backup job ships to storage, the app talks to the next data centre. That used to mean a port open to the world and an IP allowlist on a firewall that broke on every migration. Now the machines see each other directly and the access is one rule in the panel.</desc>
  <rect width="324" height="112" fill="#101714" />
  <g transform="translate(12 12)">
    <rect x="0" y="20" width="96" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="48.0" y="39.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">ci-runner</text>
    <line x1="96" y1="36" x2="180" y2="36" stroke="#9aefb4" stroke-width="2" />
    <text x="138" y="30" fill="#9aefb4" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">:5432</text>
    <rect x="180" y="20" width="120" height="32" rx="7" fill="#18221d" stroke="#2d3a31" />
    <text x="240.0" y="39.5" fill="#eef3ef" font-family="ui-monospace,monospace" font-size="10.5" text-anchor="middle">db-fra-1</text>
    <text x="150" y="76" fill="#a5b3aa" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">firewall allowlists</text>
    <line x1="93" y1="72" x2="207" y2="72" stroke="#a5b3aa" stroke-width="1.2" />
  </g>
</svg>
