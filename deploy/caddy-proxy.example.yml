# Реконструирован из работающего контейнера (docker inspect): исходный файл был
# утерян, а без него прокси нечем пересоздать. Значения — ровно те, с которыми
# контейнер работает сейчас; добавлена только вторая ingress-сеть.
services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13.1
    restart: always
    environment:
      # Прокси видит контейнеры ТОЛЬКО в перечисленных сетях. Отдельная сеть под
      # NodeRoost нужна, чтобы соседи по общей сети не доставали API панели в
      # обход IP-вайтлиста (см. SECURITY.md, «Изоляция сети»).
      CADDY_INGRESS_NETWORKS: caddy,noderoost-edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/data
      # Только на чтение: прокси смотрит в интернет портами 80 и 443, а доступ
      # к сокету на запись - это root на хосте, где лежат .env с секретом
      # подписи токенов, база панели и приватные ключи control-сервера.
      # Сам caddy-docker-proxy из сокета только читает метки контейнеров.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - caddy
      - noderoost-edge

networks:
  caddy:
    external: true
  noderoost-edge:
    external: true
