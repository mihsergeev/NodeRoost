server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # не раскрываем версию nginx
    server_tokens off;

    # Аутентификация — внутренняя (JWT + 2FA) в самой панели; сетевой доступ
    # ограничивается IP-whitelist'ом на реверс-прокси (Caddy).

    # запрет индексации поисковиками
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Заголовки безопасности. CSP: script только со своего origin (нет inline-
    # скриптов), data: — для QR-картинок, unsafe-inline в style — для инлайновых
    # стилей React; img-src включает svg-лого (свой origin) и data:.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS: игнорируется по HTTP (standalone), применяется когда впереди HTTPS-прокси
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Адрес бэкенда — через ПЕРЕМЕННУЮ и встроенный DNS докера (127.0.0.11).
    # С литеральным именем nginx резолвит его однажды при старте и держит адрес
    # вечно: после `compose up -d --build backend` контейнер получает новый IP, а
    # фронт продолжает стучаться по старому и отдаёт 502 до тех пор, пока кто-то
    # не перезапустит и его. То есть панель ложилась после каждого обновления.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $noderoost_backend http://backend:8000;

    location /api/ {
        proxy_pass $noderoost_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # состояние для агента ноды (публично, по токену) — в backend.
    # X-Forwarded-For обязателен: по нему бэкенд считает лимит запросов. Без него
    # в развёртывании БЕЗ внешнего прокси клиент подставлял бы заголовок сам и
    # выбирал себе ключ лимитера, то есть обходил ограничение целиком.
    location /agent/ {
        proxy_pass $noderoost_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проверка Let's Encrypt для имён внутри сети. Приходит НЕ на домен панели, а
    # на само имя сервиса — оно ведёт сюда wildcard-записью. Отвечает бэкенд:
    # сертификат заказывает он, и только он знает ответ на этот токен.
    # Скрипт подключения по ссылке (публично, на домене control-сервера):
    # машину подключают откуда угодно, а панель за вайтлистом ей недоступна.
    location /join/ {
        proxy_pass $noderoost_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pkgs/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
