name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Install exactly what goes into the image: a gap between what the tests
      # checked and what ships is the dullest reason for a broken release.
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: pip install --no-deps -e backend
      - run: pip install pytest pytest-asyncio aiosqlite
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # tsc matters more than the bundle here: Vite passes dead imports over in
      # silence, while a type error catches them before the deploy
      - run: npm run build
        working-directory: frontend
      - name: i18n — duplicate keys and untranslated strings
        run: npm run check-i18n
        working-directory: frontend

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - name: Known vulnerabilities in backend dependencies
        run: pip-audit -r backend/requirements.lock --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Known vulnerabilities in frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
