name: Release

# Publishes images to GHCR on a release tag. The tag is the only trigger: images
# should appear for what was deliberately released, not for every push to main.
# Both spellings are caught (v0.1.0 and 0.1.0) — a tag without the "v" built
# nothing while .env.example already pointed installs at that missing image, so
# installing that version died on docker pull.
on:
  push:
    tags: ["v*", "[0-9]*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version without the "v": compose takes NODEROOST_VERSION as 0.1.0
      - id: ver
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # "latest" is deliberately NOT published: compose demands an explicit
          # release tag so production never moves to another build in silence
          # (see .env.example)
          tags: ghcr.io/${{ github.repository_owner }}/noderoost-${{ matrix.name }}:${{ steps.ver.outputs.value }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.value }}
            org.opencontainers.image.licenses=BSD-3-Clause
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  digests:
    needs: images
    runs-on: ubuntu-latest
    steps:
      # Digests are what production should pin to: we move tags ourselves, a
      # digest never changes. Printed into the release summary so nobody has to
      # go looking for them.
      - name: Digests of the published images
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "### Images ${v}"
            echo
            for img in backend frontend; do
              ref="ghcr.io/${{ github.repository_owner }}/noderoost-${img}:${v}"
              d=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
              echo "- \`${ref}@${d}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
